<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Price Action Trainer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Sidebar ───────────────────────────────────────────────────── -->
  <aside id="sidebar">

    <div class="sidebar-header">
      <div class="app-name">Price Action Trainer</div>
    </div>

    <div class="sidebar-body">

      <!-- Symbol -->
      <div class="field-group">
        <div class="field-label">Symbol</div>
        <div class="input-row">
          <input id="symbolInput" type="text" value="AAPL" spellcheck="false" autocomplete="off" />
          <button id="randomBtn" class="dice-btn" title="Random symbol">⚄</button>
        </div>
      </div>

      <!-- Interval -->
      <div class="field-group">
        <div class="field-label">Interval</div>
        <select id="intervalSelect">
          <option value="1d" selected>Daily</option>
          <option value="1wk">Weekly</option>
          <option value="1mo">Monthly</option>
          <option value="1h">Hourly</option>
          <option value="15m">15 min</option>
          <option value="5m">5 min</option>
        </select>
      </div>

      <!-- Date range -->
      <div class="field-group">
        <div class="field-label">Date range</div>
        <input id="startDate" type="date" value="2020-01-01" />
        <input id="endDate" type="date" style="margin-top:4px" />
      </div>

      <!-- Start bar -->
      <div class="field-group">
        <div class="field-label">Starting bars</div>
        <input id="startBar" type="number" value="50" min="5" max="5000" />
        <div class="field-hint">Bars visible at session start</div>
      </div>

      <!-- Noise -->
      <div class="field-group">
        <div class="noise-row">
          <div class="noise-label-group">
            <span class="noise-title">Noise</span>
            <span class="noise-sub">OHLC jitter &nbsp;<span id="noiseVal">1.0</span>%</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="noiseToggle" />
            <span class="slider"></span>
          </label>
        </div>
        <input id="noiseRange" type="range" min="0.1" max="5" step="0.1" value="1.0" />
      </div>

      <!-- Load -->
      <button id="loadBtn" class="load-btn">Load Data</button>
      <div id="statusMsg" class="status-msg"></div>

      <div class="divider"></div>

      <!-- Cache -->
      <div class="field-group cache-section">
        <div class="cache-header">
          <div class="field-label">Cached</div>
          <button id="refreshCacheBtn" class="cache-refresh" title="Refresh">↺</button>
        </div>
        <ul id="cacheList"></ul>
      </div>

    </div>
  </aside>

  <!-- ── Chart area ─────────────────────────────────────────────────── -->
  <main id="chartArea">

    <div id="topBar">
      <span id="symbolLabel">—</span>
      <span id="intervalLabel"></span>
      <span id="barInfo"></span>
      <span id="ohlcInfo"></span>
    </div>

    <div id="chartContainer"></div>

    <div id="bottomBar">
      <span class="key-hint"><span class="key">←</span><span class="action">remove</span></span>
      <span class="hint-sep"></span>
      <span class="key-hint"><span class="key">→</span><span class="action">reveal</span></span>
      <span class="hint-sep"></span>
      <span class="key-hint"><span class="key">↑</span><span class="action">+10</span></span>
      <span class="hint-sep"></span>
      <span class="key-hint"><span class="key">↓</span><span class="action">−10</span></span>
      <span class="hint-sep"></span>
      <span class="key-hint"><span class="key">space</span><span class="action">random start</span></span>
    </div>

  </main>

  <script src="/vendor/lightweight-charts.js"></script>
  <script src="/stocks.js"></script>
  <script src="/renderer.js"></script>
</body>
</html>
